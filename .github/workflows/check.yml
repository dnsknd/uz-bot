name: Check schedule

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хвилин (GitHub може трохи запізнюватись)
  workflow_dispatch:          # дозволяє запустити вручну кнопкою

permissions:
  contents: write             # щоб зберігати state.json у репозиторії

concurrency:
  group: uz-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "uz-bot"
          git config user.email "uz-bot@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          git diff --cached --quiet || (git commit -m "update state" && git push)
